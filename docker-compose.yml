# TRD §17.2 — 로컬 개발은 `docker compose up -d db`만 쓴다.
# 운영(정도희 자택 서버): `docker compose up -d --build`. 외부에 여는 포트는 없다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '14'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skincare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-skincare}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 로컬 개발용. 127.0.0.1에만 바인드하므로 서버에서도 외부에 노출되지 않는다.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skincare} -d ${POSTGRES_DB:-skincare}']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-skincare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skincare}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    logging: *default-logging

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    expose:
      - '80'
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    # app.<도메인> → web:80 (터널 설정은 Cloudflare 대시보드)
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    logging: *default-logging

volumes:
  pgdata:
