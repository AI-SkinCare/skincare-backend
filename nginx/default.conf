# 운영 compose의 web(nginx 1.27) 기본 설정 — 세부 튜닝은 정도희 담당 (TRD §1.3).
# 앱만 쓰므로 정적 파일 서빙 없음. /api(Swagger 포함)만 backend로 넘긴다.
server {
    listen 80;
    server_name _;

    # 업로드 12MB 제한 (백엔드는 10MB 초과를 413 E2003으로 거절)
    client_max_body_size 12m;
    # nginx가 413을 직접 낼 때도 앱이 같은 봉투를 받게 한다
    error_page 413 = @too_large;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CF-Connecting-IP·X-Request-Id·X-Client는 클라이언트 헤더 그대로 전달된다
        proxy_read_timeout 60s;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"error":{"code":"E2003","message":"사진 용량이 너무 커요. 10MB 이하로 올려 주세요.","detail":null}}';
    }

    location / {
        return 404;
    }
}
