# TRD §16.3 — develop·main 대상 PR과 푸시에서 형식 검사·단위 테스트·빌드·통합 테스트
# develop 푸시에서 테스트가 통과하면 운영 서버로 배포한다 (docs/deploy.md)
name: ci
on:
  pull_request: { branches: [develop, main] }
  push: { branches: [develop, main] }
  # 같은 커밋을 다시 배포할 때 (Actions 탭 → ci → Run workflow, 브랜치 develop)
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # 통합 테스트 DB (이름에 test가 있어야 돈다). 그 밖의 설정은 테스트 코드가 고정 값으로 넣는다
      DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck
      - run: ./gradlew test
      - run: ./gradlew bootJar
      - run: ./gradlew integrationTest

  # 운영 서버(Mac mini) 배포 — GitHub 러너가 Tailscale에 tag:ci로 붙은 뒤 SSH로 deploy.sh를 실행한다.
  # 포크 PR에는 시크릿이 없고 PR 이벤트에서는 돌지 않는다.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: deploy-production, cancel-in-progress: false }
    environment: { name: production, url: 'https://skincare.doi2.my/api/docs' }
    steps:
      - name: Tailscale 연결
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 배포 (${{ github.sha }})
        # 서버의 authorized_keys가 이 키로는 ~/bin/skincare-deploy.sh만 실행하게 막는다. 넘기는 값은 커밋 SHA뿐이다.
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
